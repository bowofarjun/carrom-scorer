name: Build Android APK

on:
  workflow_dispatch: 

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: cd frontend && yarn install

      - name: Generate Android project
        run: cd frontend && npx expo prebuild --platform android

      - name: Build Release APK (Bundles the App)
        # This is the crucial change: assembleRelease bundles your JS code
        run: cd frontend/android && ./gradlew assembleRelease

      - name: Sign the APK
        # Android requires release APKs to be signed to install them
        run: |
          cd frontend/android/app/build/outputs/apk/release
          mv app-release-unsigned.apk carrom-scorer.apk
          keytool -genkey -v -keystore temp.keystore -alias temp -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Test" -storepass password -keypass password
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
          $APKSIGNER sign --ks temp.keystore --ks-pass pass:password carrom-scorer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carrom-scorer-release-apk
          path: frontend/android/app/build/outputs/apk/release/carrom-scorer.apk
